# =============================================================================
# The collection: every work the front page's bento grid draws from.
#
# The order here is the order the grid fills, left to right, top to bottom.
# Copy one block to add a work, and delete a block to remove one.
#
# These twelve works are PLACEHOLDERS: each `image` points at a numbered drawing
# in public/media/placeholders, not at a real piece. Replace each block with a
# real work and its file when the material is supplied. The titles, artists, and
# years here are neutral labels, not claims about anyone's work.
#
# HOW TO EDIT
#   * A "#" starts a note for you. The site ignores everything after it.
#   * Keep the indentation exactly as it is. Each level is two spaces deeper.
#   * Keep the wording before each ":" unchanged. Change only what follows it.
#   * A list item begins with "- ". Keep the keys inside every item.
#   * Every work needs its own slug: the pages point at works by that name.
#   * Save the file, then reload the page.
# =============================================================================

artworks:
  - slug: work-01
    title: Work 01
    artist: Yujin Kim
    year: 2024
    material: Placeholder, not a real medium.
    description: A placeholder work standing in the first grid slot. Replace it with a real piece.
    # true = a museum work, so its source link is kept on the artwork page.
    reference: false
    # A file in public/media. For a museum work, use image_id and source instead.
    image: /media/placeholders/work-01.svg
    alt: Placeholder drawing numbered 01, a tall panel.
    # The real proportions of the image file, in pixels.
    width: 1200
    height: 1500
    # The part of the work the close-up shows: horizontal% vertical%.
    crop: '50% 50%'
    # How much space the work takes in the collection.
    # large | small | offset | wide
    size: large
