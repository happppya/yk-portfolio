# =============================================================================
# The collection: every work the Art page and the Me teaser draw from.
#
# The order here is the order visitors scroll through, after the featured work.
# Copy one block to add a work, and delete a block to remove one.
#
# HOW TO EDIT
#   * A "#" starts a note for you. The site ignores everything after it.
#   * Keep the indentation exactly as it is. Each level is two spaces deeper.
#   * Keep the wording before each ":" unchanged. Change only what follows it.
#   * A list item begins with "- ". Keep the keys inside every item.
#   * Every work needs its own slug: the pages point at works by that name.
#   * Save the file, then reload the page.
# =============================================================================

artworks:
  - slug: improvisation
    title: Improvisation No. 30 (Cannons)
    artist: Vasily Kandinsky
    year: 1913
    material: Oil on canvas
    description: Loose fields of color intersect with black lines and fragments of recognizable forms.
    # true = a museum work, so its source link is kept on the artwork page.
    reference: true
    # A reference image id from the Art Institute of Chicago. For Yujin's own
    # work, delete this line and use image: with a file in public/media instead.
    image_id: b5bc6b66-9e6e-fe57-dcec-fc49e820e904
    source: https://www.artic.edu/artworks/8991/improvisation-no-30-cannons
    alt: Colorful abstract painting with sweeping black lines and overlapping yellow, blue, and pink forms.
    # The real proportions of the image file, in pixels.
    width: 10199
    height: 10244
    # The part of the work the close-up shows: horizontal% vertical%.
    crop: '68% 64%'
    # How much space the work takes in the collection.
    # large | small | offset | wide
    size: large
  - slug: water-lilies
    title: Water Lilies
    artist: Claude Monet
    year: 1906
    material: Oil on canvas
    description: Pink and white water lilies float across a pond built from short, layered brushstrokes.
    reference: true
    image_id: 3c27b499-af56-f0d5-93b5-a7f2f1ad5813
    source: https://www.artic.edu/artworks/16568/water-lilies
    alt: A blue-green pond with pink and white water lilies and reflections on the water.
    width: 8808
    height: 8460
    crop: '60% 72%'
    size: small
  - slug: green-center
    title: Painting with Green Center
    artist: Vasily Kandinsky
    year: 1913
    material: Oil on canvas
    description: Colored forms converge around a green center, with dark strokes crossing the composition.
    reference: true
    image_id: c68f33ec-feb1-5277-334b-b71ac15ae394
    source: https://www.artic.edu/artworks/8987/painting-with-green-center
    alt: Abstract painting of intersecting colored forms around a green center.
    width: 2417
    height: 2250
    crop: '45% 48%'
    size: offset
  - slug: two-poplars
    title: Landscape with Two Poplars
    artist: Vasily Kandinsky
    year: 1912
    material: Oil on canvas
    description: Trees and mountains become broad, saturated shapes in this landscape. The full painting and detail crop demonstrate two ways of looking at one image.
    reference: true
    image_id: 9694ca0c-c4c4-e48d-566f-4d248990cff4
    source: https://www.artic.edu/artworks/8980/landscape-with-two-poplars
    alt: A vivid landscape with two trees, green hills, and blue mountains.
    width: 8496
    height: 6694
    crop: '30% 55%'
    size: wide
