# =============================================================================
# The Me page: the opening statement, the portrait, and the teaser rows.
#
# Me is the site's second destination, at /me. The front page is the Art grid.
#
# HOW TO EDIT
#   * A "#" starts a note for you. The site ignores everything after it.
#   * Keep the indentation exactly as it is. Each level is two spaces deeper.
#   * Keep the wording before each ":" unchanged. Change only what follows it.
#   * To empty a field, delete the text after the ":" and leave nothing there.
#   * A list item begins with "- ". Keep the keys inside every item.
#   * Save the file, then reload the page.
# =============================================================================

# Opening statement on the Me page.
heading:
  - Art is science
  - made clear.
# A small grey credit beside the heading, for a quote's author or a source.
# Leave it empty to show nothing, the way a plain statement would.
heading_attribution: — Jean Cocteau

# Subheading below the opening statement.
introduction: An archive of my creative projects, my music, and my research.
portrait:
  # A file in public/media, or a full https:// address.
  image: /media/portrait.jpg
  alt: Reference portrait photograph, not Yujin Kim.
  # The line above the image caption.
  lead: Hello, I'm Yujin!
  # The image caption.
  caption: Always overthinking a detail nobody else will notice. Powered by good coffee and bad jokes. Here's what I'm currently building.
  # The real proportions of the image file, in pixels.
  width: 900
  height: 1125
# The work shown in the teaser below the hero. Must match a slug in artworks.yaml.
featured_artwork: work-01
art_teaser:
  heading:
    - Look a little
    - closer.
# The two teaser rows at the foot of the page.
teasers:
  music:
    title: Music
    summary: Listening, rehearsal, performance.
  research:
    title: Research
    summary: Projects, papers, questions.
