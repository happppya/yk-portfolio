# =============================================================================
# Every colour the site uses, including the Me hero's own colour scheme.
#
# Nothing here changes the layout, and nothing here is a picture. Each value is a
# colour written as a hex value in quotes: #rrggbb, or #rrggbbaa when it needs to
# be see-through.
#
# HOW TO EDIT
#   * Keep the quotes around every colour. A "#" outside quotes starts a note.
#   * Both modes below must keep the same settings; only the values change.
#   * Save the file, then reload the page.
#
# The stylesheet in src/index.css carries the same values so the first paint is
# already correct before the page finishes loading. A test fails if the two drift
# apart, so edit this file and let the test tell you what to copy across.
# =============================================================================

# -----------------------------------------------------------------------------
# Accents: one per destination. They are the same in both modes.
# -----------------------------------------------------------------------------
accents:
  # Me wears the hero canvas's purple: the warm folds of the atmosphere pulled into one
  # value, sitting between the light and dark warm stops so it reads in both modes.
  me: '#8d4874'
  # Art is yellow: a muted gold rather than a bright one, so it sits with the plum and teal.
  art: '#c9a227'
  music: '#6f4a84'
  research: '#2f6f6a'

# -----------------------------------------------------------------------------
# The ink that sits on an accent: light ink for the dark accents, dark ink for
# the light one. The pair travels together, so a link preview never shows the
# wrong one.
# -----------------------------------------------------------------------------
ink:
  light: '#eeeff0'
  dark: '#17191c'

# -----------------------------------------------------------------------------
# The scrim behind a dialog, over whatever is on the page beneath it.
# -----------------------------------------------------------------------------
scrim: '#0f1114b8'

# -----------------------------------------------------------------------------
# The two modes. Every setting has to appear in both.
# -----------------------------------------------------------------------------
modes:
  light:
    # The page background, and the raised surface behind an image still loading.
    surface: '#eeeff0'
    surface_raised: '#e3e5e7'
    # Names, titles, body text.
    text: '#17191c'
    # Captions and secondary facts.
    secondary: '#525861'
    # Hairlines and panel boundaries.
    line: '#c1c5c9'
    # The keyboard focus ring.
    focus: '#17191c'
    # The Me hero's own palette. "Deep" is the denser fold of the pattern, "warm"
    # is the veil over it: these two are what tune the hero's colour scheme.
    atmosphere:
      deep: '#14337a'
      warm: '#643352'
    # The page background's own two hues, behind every tab: a cool underpainting
    # and a warm field, faint echoes of the hero above so the whole site shares
    # one light. The per-tab accent is a third field that drifts between pages.
    ambient:
      cool: '#2c3f7e'
      warm: '#8a5570'
  dark:
    surface: '#17191c'
    surface_raised: '#23262b'
    text: '#eeeff0'
    secondary: '#afb5bf'
    line: '#454a52'
    focus: '#eeeff0'
    atmosphere:
      deep: '#14337a'
      warm: '#b65d97'
    # Lighter than the light mode's, because a near-black surface swallows a
    # mid tone: the wash has to carry its own glow here rather than be darkened.
    ambient:
      cool: '#3a5296'
      warm: '#b06a92'
