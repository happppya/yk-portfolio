<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Yujin Kim. A portfolio in four parts: art, music, research, and the person behind them."
    />
    <meta name="theme-color" content="#eeeff0" />
    <script>
      try {
        const theme = localStorage.getItem('portfolio-theme')
        document.documentElement.dataset.theme = theme === 'light' || theme === 'dark' ? theme : 'system'
      } catch (_) {}
    </script>
    <title>Me | Yujin Kim</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
